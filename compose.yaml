name: openvote
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./.runtime/secrets/database-password:/run/secrets/database-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  crypto-public:
    image: openvote-crypto:3.3.0
    platform: linux/amd64
    entrypoint: ["python3", "/tools/bridge.py"]
    environment:
      CORE_ACTIONS: verify,accept,close,verify-share,finalize
    ports: ["127.0.0.1:4310:4310"]
    volumes:
      - ./tools:/tools:ro
      - ./.runtime/secrets/core-token:/run/secrets/core-token:ro
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4310/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  crypto-ceremony:
    image: openvote-crypto:3.3.0
    platform: linux/amd64
    entrypoint: ["python3", "/tools/bridge.py"]
    environment:
      CORE_ACTIONS: setup
    ports: ["127.0.0.1:4311:4310"]
    volumes:
      - ./tools:/tools:ro
      - ./.runtime/secrets/core-token:/run/secrets/core-token:ro
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 512m
    cpus: 2
volumes:
  postgres-data:
